[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "err-o-roadrunner"
version = "0.5.0"
description = "Error-triggered triage tool (read-only failure report)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
err-o-roadrunner = "triage:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
only-include = ["triage.py", "actions_log.py", "junit_redact.py", "project_version.py"]

[tool.hatch.build.targets.sdist]
only-include = ["triage.py", "actions_log.py", "junit_redact.py", "project_version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "vendor", "tests/fixtures/readme/inputs"]
markers = [
    "success: triage with no or minimal failure evidence",
    "failure: triage with real tracebacks, junit, or node errors",
    "adversarial: malformed, huge, or hostile inputs must not crash triage",
    "gap: PR review mutation regressions",
    "actions: GitHub Actions log parsing",
    "failure_suite: deliberate failure golden suite",
    "junit_corpus: real failed-run JUnit XML golden suite",
    "multi_error: multi-error coverage and standard-error HINT floor",
    "mutation_guard: mutations targeted by scripts/combo_mutation.py",
]
