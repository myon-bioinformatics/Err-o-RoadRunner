[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "err-o-roadrunner"
version = "0.0.0"
description = "Error-triggered triage tool (repository skeleton)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/err_o_roadrunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
