# .github/workflows/harvest-corpus.yml
# Daily harvest of failed-run test results (JUnit XML / JSON / JSONL) from every public,
# non-archived myon-bioinformatics repository, so artifacts are captured before their
# 14-day retention expires. Opens a PR with new corpus entries; never auto-merges.
#
# Requirements:
# - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# - GITHUB_TOKEN can read Actions artifacts of other *public* repositories.
name: Harvest failure corpus

on:
  schedule:
    - cron: "17 18 * * *"   # 03:17 JST daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harvest-corpus
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
      - name: Install test dependencies
        run: uv sync --locked
      # Bronze: raw artifacts stay in the runner temporary directory; never upload them.
      - name: Harvest (partial results allowed)
        id: harvest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python scripts/harvest_junit_corpus.py --allow-partial --per-repo 25 --report "$RUNNER_TEMP/harvest-report.json" --summary "$RUNNER_TEMP/harvest-summary.md"
      # Coverage metadata only: no XML/JSON result bodies, independent of corpus promotion.
      - name: Publish collection coverage
        if: always() && steps.harvest.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/harvest-summary.md" ]; then
            cat "$RUNNER_TEMP/harvest-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Collection unavailable; no coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Preserve collection report
        if: always() && steps.harvest.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: harvest-coverage
          path: |
            ${{ runner.temp }}/harvest-report.json
            ${{ runner.temp }}/harvest-summary.md
          if-no-files-found: error
          retention-days: 14
      # Silver: shared redaction and XML leak scan must succeed before golden generation.
      - name: Redact corpus (Silver)
        run: uv run --locked python scripts/reredact_junit_corpus.py --corpus-only
      - name: Prepare corpus goldens
        run: |
          uv run --locked python scripts/patch_junit_manifest_jobs.py
          uv run --locked python scripts/capture_junit_corpus_goldens.py
      # Gold: validate XML, generated goldens, and JSON/JSONL before publishing corpus.
      - name: Validate corpus
        id: validate
        run: uv run pytest -q tests/test_junit_corpus_golden.py tests/test_results_corpus.py tests/test_fixture_redaction_scan.py
      - name: Open PR with new entries
        if: success() && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard tests/fixtures)" ]; then
            echo "No new corpus entries in confirmed scope; see coverage summary for unavailable repositories."
            exit 0
          fi
          branch="corpus/harvest-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tests/fixtures
          git commit -m "失敗コーパスを自動収集 ($(date -u +%F))"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "失敗コーパスの定期収集 $(date -u +%F)" \
            --body-file "$RUNNER_TEMP/harvest-summary.md"
