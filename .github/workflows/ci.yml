name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  vendor-locked:
    name: Vendor locked baseline
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify and recreate locked vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              Path(entry["destination"]).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  test:
    name: pytest (Python ${{ matrix.python-version }})
    needs: [changes, vendor-locked]
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.x"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: python -VV
      - name: Install test dependencies
        run: uv sync --locked --extra test
      - name: Compile
        run: uv run --locked python -m compileall -q triage.py actions_log.py junit_redact.py project_version.py
      - name: Import smoke
        run: uv run --locked python -c "import triage, actions_log, junit_redact, project_version"
      - name: Combo mutation (zero survivors)
        run: uv run --locked python scripts/combo_mutation.py
      - name: Version mutation (zero survivors)
        run: uv run --locked python scripts/version_mutation.py
      - name: Tests with JUnit
        run: |
          mkdir -p reports
          uv run --locked pytest -q tests --junitxml=reports/junit.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: always() && (needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml","junit-py3.x/junit.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
