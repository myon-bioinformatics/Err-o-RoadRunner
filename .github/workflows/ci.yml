name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@0361d4d81add261ba15073fc32f2a524d2b7e2de

  vendor-locked:
    name: Vendor locked baseline
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        id: setup_uv
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Fetch pinned shared vendor tool
        id: vendor_tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 26c442bc51b8a2837fe2556782b2937f396932af
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify and recreate locked vendor snapshot
        id: verify_vendor
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py recreate --manifest vendor.lock.json

      - name: Record setup JUnit
        if: ${{ !cancelled() }}
        env:
          SETUP_OUTCOMES: |
            Setup uv and Python=${{ steps.setup_uv.outcome }}
            Fetch pinned shared vendor tool=${{ steps.vendor_tool.outcome }}
            Verify and recreate locked vendor snapshot=${{ steps.verify_vendor.outcome }}
        run: python3 -S scripts/ci_setup_junit.py vendor-locked reports/setup.xml
      - name: Preserve setup JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-setup-vendor
          path: reports/setup.xml
          if-no-files-found: error
          retention-days: 14

  test:
    name: pytest (Python ${{ matrix.python-version }})
    needs: [changes, vendor-locked]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        # ⏱ PRs run the newest Python only; main runs all six
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.15"]') || fromJSON('["3.11", "3.12", "3.13", "3.14", "3.15", "3.x"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        id: setup_uv
        # The latest lane must not reuse an older system Python during venv creation.
        env:
          UV_PYTHON_PREFERENCE: ${{ matrix.python-version == '3.x' && 'only-managed' || 'managed' }}
        with:
          version: "latest"
          python-version: "${{ matrix.python-version == '3.x' && '3' || matrix.python-version }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Report Python version
        id: python_version
        run: python -VV
      - name: Install test dependencies
        id: test_deps
        run: uv sync --locked
      - name: Compile
        id: compile
        run: uv run --locked python -m compileall -q triage.py sentinel.py errlib
      - name: Import smoke
        id: import_smoke
        run: uv run --locked python -c "import triage, sentinel, errlib.actions_log, errlib.junit_redact, errlib.project_version"
      - name: Record setup JUnit
        if: ${{ !cancelled() }}
        env:
          SETUP_OUTCOMES: |
            Setup uv and Python=${{ steps.setup_uv.outcome }}
            Report Python version=${{ steps.python_version.outcome }}
            Install test dependencies=${{ steps.test_deps.outcome }}
            Compile=${{ steps.compile.outcome }}
            Import smoke=${{ steps.import_smoke.outcome }}
        run: python3 -S scripts/ci_setup_junit.py pytest-py${{ matrix.python-version }} reports/setup.xml
      - name: Preserve setup JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-setup-py${{ matrix.python-version }}
          path: reports/setup.xml
          if-no-files-found: error
          retention-days: 14
      - name: Combo mutation (zero survivors)
        if: github.event_name != 'pull_request'
        run: uv run --locked python scripts/check_mutations.py combo
      - name: Version mutation (zero survivors)
        if: github.event_name != 'pull_request'
        run: uv run --locked python scripts/check_mutations.py version
      - name: Partial-case mutation (zero survivors)
        if: github.event_name != 'pull_request'
        run: uv run --locked python scripts/check_mutations.py partial
      - name: Tests with JUnit
        run: |
          mkdir -p reports
          uv run pytest -q tests --junitxml=reports/junit.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@0361d4d81add261ba15073fc32f2a524d2b7e2de
    with:
      expected-reports: ${{ github.event_name == 'pull_request' && '["junit-py3.15/junit.xml"]' || '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml","junit-py3.x/junit.xml"]' }}
      artifact-pattern: "junit-py*"
      output-artifact: failure-identity
      commit-sha: ${{ github.sha }}

  setup-identity:
    needs: [changes, vendor-locked, test]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@0361d4d81add261ba15073fc32f2a524d2b7e2de
    with:
      # A failed vendor gate blocks the entire pytest matrix; do not invent its setup reports.
      expected-reports: ${{ needs.vendor-locked.result != 'success' && '["junit-setup-vendor/setup.xml"]' || github.event_name == 'pull_request' && '["junit-setup-vendor/setup.xml","junit-setup-py3.15/setup.xml"]' || '["junit-setup-vendor/setup.xml","junit-setup-py3.11/setup.xml","junit-setup-py3.12/setup.xml","junit-setup-py3.13/setup.xml","junit-setup-py3.14/setup.xml","junit-setup-py3.15/setup.xml","junit-setup-py3.x/setup.xml"]' }}
      artifact-pattern: "junit-setup-*"
      output-artifact: setup-identity
      commit-sha: ${{ github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@0361d4d81add261ba15073fc32f2a524d2b7e2de
